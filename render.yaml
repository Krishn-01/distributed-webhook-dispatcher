services:
  # Single-process Web Service (Runs Express API + Embedded BullMQ Worker + Serves React Frontend)
  - type: web
    name: webhook-dispatcher
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:all && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: ENABLE_SSRF_PROTECTION
        value: "true"
      - key: ALLOW_PRIVATE_HOSTS
        value: "false"
      - key: SELF_BASE_URL
        value: "" # Set to your Render service URL (e.g. https://webhook-dispatcher.onrender.com)
      - key: CORS_ORIGIN
        value: "*"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW_MS
        value: "1000"
