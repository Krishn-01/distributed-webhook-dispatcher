services:
  # 1. Express API Ingestion Web Service
  - type: web
    name: webhook-dispatcher-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-postgres
          property: connectionString
      - key: REDIS_URL
        value: rediss://default:password@host:port # Configured via Render Redis or Upstash Redis
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_SSRF_PROTECTION
        value: "true"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW_MS
        value: "1000"

  # 2. BullMQ Asynchronous Background Delivery Worker
  - type: worker
    name: webhook-dispatcher-worker
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-postgres
          property: connectionString
      - key: REDIS_URL
        value: rediss://default:password@host:port # Configured via Render Redis or Upstash Redis
      - key: LOG_LEVEL
        value: info
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: ENABLE_SSRF_PROTECTION
        value: "true"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW_MS
        value: "1000"

databases:
  - name: webhook-postgres
    plan: free
    region: oregon
    databaseName: webhook_dispatcher
    user: webhook_admin
